default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "storage/development.sqlite3") %>

test:
  <<: *default
  database: storage/test<%= ENV["TEST_ENV_NUMBER"] %>.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "storage/production.sqlite3") %>
